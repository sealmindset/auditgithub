post:
  tags:
    - Feedback
  summary: Submit feedback
  description: Submit user feedback or feature request
  operationId: submitFeedback
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - type
            - message
          properties:
            type:
              type: string
              enum: [bug, feature, improvement, other]
            message:
              type: string
            category:
              type: string
  responses:
    '200':
      $ref: '../../components/responses.yaml#/Success'
    '401':
      $ref: '../../components/responses.yaml#/Unauthorized'

get:
  tags:
    - Organizations
  summary: Get credentials status
  description: |
    Check if GitHub credentials are configured for an organization.

    **Note:** Does not return actual credential values for security reasons.
    Only indicates whether credentials exist.
  operationId: getCredentialsStatus
  parameters:
    - $ref: '../../components/parameters.yaml#/OrgName'
  responses:
    '200':
      description: Credentials status retrieved successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              organization:
                type: string
                example: "example-org"
              github_token_configured:
                type: boolean
                example: true
              github_org_configured:
                type: boolean
                example: true
              fully_configured:
                type: boolean
                example: true
    '500':
      $ref: '../../components/responses.yaml#/InternalServerError'

put:
  tags:
    - Organizations
  summary: Update credentials
  description: |
    Update GitHub credentials for an organization.

    Use this to rotate or update the GitHub Personal Access Token.
    The token is stored securely in the secrets manager.

    **Required token scopes:** repo, read:org, read:user
  operationId: updateCredentials
  parameters:
    - $ref: '../../components/parameters.yaml#/OrgName'
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas.yaml#/UpdateCredentialsRequest'
        example:
          github_token: "ghp_new_token_here"
          github_org: "example-org"
  responses:
    '200':
      description: Credentials updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: "Credentials updated for 'example-org'"
    '404':
      $ref: '../../components/responses.yaml#/NotFound'
    '500':
      $ref: '../../components/responses.yaml#/InternalServerError'
